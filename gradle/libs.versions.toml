# Version catalog — pinned per PLAN.md §1.1. Upgrade only between phases.
# v1.4.4: the ABI-critical platform versions (serialization, coroutines,
# okio, xmlutil, okhttp) are pinned to the Keiyoushi donor's (Komikku)
# values — extensions are compiled against that platform and meet OUR
# copies at runtime. PlatformParityTest enforces the match.
[versions]
agp = "8.7.3"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
coroutines = "1.11.0"
okhttp = "5.3.2"
okio = "3.17.0"
serializationJson = "1.11.0"
xmlutil = "0.91.3"
room = "2.8.3"
datastore = "1.1.1"
workmanager = "2.10.0"
pdfboxAndroid = "2.0.27.0"
kxml2 = "2.3.0"
coil = "2.7.0"
junrar = "7.5.5"
junit = "4.13.2"
robolectric = "4.15.1"
androidxTestRunner = "1.6.2"
jsoup = "1.18.3"
quickjs = "0.9.2"
mlkitFace = "16.1.7"
camerax = "1.3.4"
playServicesAuth = "21.2.0"
glance = "1.1.1"
haze = "1.5.1"
profileinstaller = "1.4.1"
injekt = "91edab2317"
androidxPreference = "1.2.1"
logcat = "0.4"
# v1.5.6 (§3): Readium Kotlin EPUB carrier, pinned 3.1.2 — the newest
# line whose AARs fit compileSdk 36 + Kotlin 2.2.21 unchanged (3.4.0
# demands compileSdk 37; see build-logs/V156-CARRIER-VERIFICATION.md).
# Desugaring is a hard Readium requirement; 2.1.5 is the known-good
# pairing for AGP 8.7.3 (the 3.1.2 AARs themselves name 2.0.4).
readium = "3.1.2"
desugarJdkLibs = "2.1.5"
# v1.5.6: Readium's media3 transitives flip Guava resolution to the
# empty listenablefuture stub, breaking ML Kit/CameraX's
# ListenableFuture access — pin the real Guava (android flavour).
guava = "33.3.1-android"
# v1.5.7 (Komikku full): the donor's tiling page view — Tachiyomi's
# fork of SubsamplingScaleImageView, at the exact commit the donor
# pins (research/komikku gradle/libs.versions.toml:50). JitPack is
# already a repository in settings.gradle.kts (for Injekt).
subsamplingScaleImageView = "66e0db195d"

